<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173d35">
  <title>RSR 今ここマップ</title>
  <link rel="stylesheet" href="../assets/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <header>
    <p>RISING SUN ROCK FESTIVAL 2026</p>
    <h1>今ここ<span>マップ</span></h1>
    <div id="connection" class="connection">接続中…</div>
  </header>

  <main>
    <section class="controls" aria-label="現在地を登録">
      <label for="display-name">あなたの名前</label>
      <div class="name-row">
        <input id="display-name" maxlength="20" autocomplete="nickname" placeholder="例：しげ">
        <button id="save-name" type="button">保存</button>
      </div>
      <p class="hint">現在地を使うか、地図をタップして位置を選んでください。</p>
      <div class="actions">
        <button id="locate" class="secondary" type="button">◎ 現在地を取得</button>
        <button id="pin-now" class="primary" type="button" disabled>📍 今ここ</button>
      </div>
      <p id="selection" class="selection">位置を選択してください</p>
    </section>

    <section class="map-card">
      <div id="map" aria-label="RSR2026会場マップ"></div>
      <div class="legend"><span><i class="latest"></i>最新</span><span><i class="past"></i>過去</span></div>
    </section>

    <section class="timeline">
      <div class="section-head"><h2>みんなの履歴</h2><button id="refresh" type="button">↻ 更新</button></div>
      <div id="people" class="people"></div>
      <p id="empty" class="empty" hidden>まだピンがありません。</p>
    </section>
  </main>

  <dialog id="setup-dialog">
    <h2>共有サーバーの設定が必要です</h2>
    <p>Supabaseの接続情報を設定すると、全員のスマホで同じピンを共有できます。</p>
    <p><code>ima-koko/config.js</code> にURLと公開用キーを設定してください。</p>
  </dialog>

  <script src="../assets/leaflet/leaflet.js"></script>
  <script src="config.js?v=2"></script>
  <script type="module" src="app.js?v=2"></script>
</body>
</html>
