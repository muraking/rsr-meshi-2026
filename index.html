<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101c19">
  <meta name="description" content="RSR2026のフェス飯をメニューから素早く探せる非公式検索ツール">
  <title>RSR MESHI 2026｜フェス飯検索</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://rsr.wess.co.jp">
  <link rel="stylesheet" href="assets/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
  <header class="hero">
    <div class="eyebrow">RISING SUN ROCK FESTIVAL 2026</div>
    <div class="brand-row"><h1>RSR <span>MESHI</span></h1><div class="sun" aria-hidden="true"></div></div>
    <p>いま食べたいものから、会場の一皿を探そう。</p>
  </header>

  <main>
    <section class="search-panel" aria-label="検索条件">
      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="search" type="search" aria-label="店名・メニューを検索" placeholder="店名・メニュー（例：油そば、ビール）" autocomplete="off">
        <button id="clear-search" class="icon-button" type="button" aria-label="検索語を消す">×</button>
      </label>
      <h2>何が食べたい？</h2>
      <div id="categories" class="category-grid" aria-label="カテゴリー"></div>
      <label class="area-filter"><span>出店エリアから探す</span><select id="area-filter" aria-label="出店エリア"><option value="">すべての出店エリア</option></select></label>
      <div class="filter-row">
        <div class="favorite-filters">
          <label class="switch"><input id="shop-favorites-only" type="checkbox"><span>♥ お店</span></label>
          <label class="switch"><input id="menu-favorites-only" type="checkbox"><span>♥ メニュー</span></label>
        </div>
        <button id="locate" class="secondary" type="button">◎ 現在地を使う</button>
      </div>
      <div id="subfilters" class="subfilters" hidden></div>
    </section>

    <section class="results" aria-live="polite">
      <div class="results-head">
        <div><span id="result-count">—</span><small> 件のメニュー</small></div>
        <select id="sort" aria-label="並び順"><option value="name">店名順</option><option value="distance">現在地から近い順</option></select>
      </div>
      <div id="status" class="status">データを読み込んでいます…</div>
      <div id="cards" class="cards"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="メインナビゲーション">
    <button data-action="search" class="active"><b>⌕</b><span>探す</span></button>
    <button data-action="near"><b>◎</b><span>近い</span></button>
    <button data-action="favorites"><b>♡</b><span>お気に入り</span></button>
  </nav>

  <dialog id="detail"><div id="detail-content"></div></dialog>
  <dialog id="map-dialog" class="map-dialog">
    <button class="map-close" type="button" aria-label="地図を閉じる">×</button>
    <div class="map-heading"><b id="map-shop-name"></b><span id="map-area-name"></span></div>
    <div id="shop-map" aria-label="店舗と現在地の地図"></div>
    <div class="map-legend"><span><i class="place-dot"></i>出店エリア</span><span><i class="you-dot"></i>現在地</span></div>
    <button id="map-locate" class="map-locate" type="button">◎ 現在地も表示</button>
    <p>公式会場マップ上の出店エリア中心です。現在地はGPSをこの会場図へ変換して表示するため、実際の位置とずれる場合があります。</p>
  </dialog>
  <template id="card-template">
    <article class="card">
      <button class="card-main" type="button">
        <div class="photo-wrap"><img class="photo" alt="" loading="lazy"><span class="special">RSR SPECIAL</span></div>
        <div class="card-body"><div class="area"></div><h3 class="menu-name"></h3><div class="shop-name"></div><div class="chips"></div><div class="distance"></div></div>
      </button>
      <div class="card-favorites">
        <button class="shop-favorite" type="button" aria-label="お店をお気に入りに追加">店♡</button>
        <button class="menu-favorite" type="button" aria-label="メニューをお気に入りに追加">飯♡</button>
        <button class="map-direct" type="button" aria-label="お店の場所を地図で見る">地図</button>
      </div>
    </article>
  </template>
  <script src="assets/leaflet/leaflet.js"></script>
  <script src="app.js?v=11" defer></script>
</body>
</html>
